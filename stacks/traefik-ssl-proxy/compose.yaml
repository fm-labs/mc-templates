services:

  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6.2}
    # Enables the web UI and tells Traefik to listen to docker
    ports:
      - "80:80"
      - "443:443" # Expose port 443 for HTTPS
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # Needed for Traefik to see containers & labels
      #- /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent cert storage
      - traefik_letsencrypt:/letsencrypt
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      # Use the traefik-ssl network (declared below)
      - traefik.docker.network=traefik-ssl

      # admin-auth middleware with HTTP Basic auth
      # Using the environment variables TRAEFIK_DASHBOARD_ADMIN_USER and TRAEFIK_DASHBOARD_ADMIN_PASSWORD
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_DASHBOARD_ADMIN_USER?Variable not set}:${TRAEFIK_DASHBOARD_ADMIN_PASSWORD?Variable not set}
      # Enable HTTP Basic auth, using the middleware created above
      - traefik.http.routers.traefik-dashboard-https.middlewares=admin-auth

      # middleware: security-headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=no-referrer"
      # Strip headers (Server and X-Powered-By)
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Powered-By="
      # Default Permissions-Policy
      #- "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=geolocation=(), microphone=()"
      # Default CSP header
      #- "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; font-src 'self';"
      #- "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self';"

      # Route: HTTPS dashboard at https://${DASH_SUBDOMAIN}.${ROOT_DOMAIN}
      #- traefik.http.routers.traefik.rule=Host(`${DASH_SUBDOMAIN}.${ROOT_DOMAIN}`)
      #- traefik.http.routers.traefik.entrypoints=websecure
      #- traefik.http.routers.traefik.tls=true
      #- traefik.http.routers.traefik.tls.certresolver=le
      #- traefik.http.routers.traefik.service=api@internal


      # Security headers for the dashboard
      #- traefik.http.middlewares.secure-headers.headers.stsSeconds=63072000
      #- traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      #- traefik.http.middlewares.secure-headers.headers.stsPreload=true
      #- traefik.http.middlewares.secure-headers.headers.frameDeny=true
      #- traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      #- traefik.http.routers.traefik.middlewares=secure-headers@docker
      # Define the port inside of the Docker service to use
      #- traefik.http.services.traefik-dashboard.loadbalancer.server.port=${TRAEFIK_DASHBOARD_PORT:-8080}
      # Make Traefik use this domain (from an environment variable) in HTTP
      #- traefik.http.routers.traefik-dashboard-http.entrypoints=http
      #- traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.${DOMAIN?Variable not set}`)
      # traefik-https the actual router using HTTPS
      #- traefik.http.routers.traefik-dashboard-https.entrypoints=https
      #- traefik.http.routers.traefik-dashboard-https.rule=Host(`traefik.${DOMAIN?Variable not set}`)
      #- traefik.http.routers.traefik-dashboard-https.tls=true
      # Use the "le" (Let's Encrypt) resolver created below
      #- traefik.http.routers.traefik-dashboard-https.tls.certresolver=le
      # Use the special Traefik service api@internal with the web UI/Dashboard
      #- traefik.http.routers.traefik-dashboard-https.service=api@internal
      # https-redirect middleware to redirect HTTP to HTTPS
      #- traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      #- traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      # traefik-http set up only to use the middleware to redirect to https
      #- traefik.http.routers.traefik-dashboard-http.middlewares=https-redirect


    command:
      # Enable the Dashboard and API
      - --api
      - --api.dashboard=${TRAEFIK_DASHBOARD_ENABLED:-false}
      - --api.insecure=${TRAEFIK_DASHBOARD_INSECURE:-false}
      #- --entrypoints.dashboard.address=:8080

      # Read labels from Docker services
      # Only explicitly exposed services
      # Use socket-proxy to avoid permission issues
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375

      # --- Entrypoints ---
      # :80 remains for ACME HTTP-01 + redirect; everything else goes to :443
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=security-headers@docker

      # --- Let's Encrypt (HTTP-01 challenge on :80) ---
      - --certificatesresolvers.le.acme.email=${TRAEFIK_LETSENCRYPT_EMAIL:-acme@example.org}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # --- Logging ---
      # Enable the access log, with HTTP requests
      - --accesslog=true
      - --accesslog.format=common
      # Enable the Traefik log, for configurations and errors
      - --log
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --log.format=common
      - --log.nocolor=true

    networks:
      - traefik-ssl


  socket-proxy:
    image: tecnativa/docker-socket-proxy
    restart: always
    environment:
      CONTAINERS: "1"
      SERVICES: "1"
      LABELS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - traefik-ssl


networks:
  traefik-ssl:
    external: true


volumes:
  traefik_letsencrypt: